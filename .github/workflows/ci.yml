name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # A throwaway Postgres container, local to this one CI job — destroyed
    # when the job ends. NOT the shared production database (that one is
    # never touched by CI, per this repo's database-safety rules — this
    # service is isolated, empty, and disposable). It exists because a
    # couple of public pages (/, /pricing) run a real Prisma query at BUILD
    # time during static prerendering (they list active PartnerTypes), so
    # `next build` needs a reachable — even if empty — Postgres to succeed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply schema to the throwaway CI database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Build
        run: npx next build
        env:
          # Dummy values so the build doesn't fail on missing env vars for
          # features that read them lazily (see src/lib/env.ts) — CI only
          # needs the build to succeed, not to talk to a real central-api.
          SUPER_ADMIN_SECRET: ci-placeholder-secret
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/ci
          CENTRAL_API_URL: https://example.invalid
          CENTRAL_API_KEY: ci-placeholder-key
