name: Scheduled jobs

# Replaces Vercel Cron (vercel.json's "crons" removed) — we rely on GitHub
# Actions for scheduling instead. Each job just hits the same authenticated
# cron endpoint Vercel Cron used to call, with the same CRON_SECRET bearer
# token (set as a repo secret: Settings -> Secrets and variables -> Actions).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    # Re-dispatch Field Force bookings whose provider offers expired.
    - cron: "*/5 * * * *"
    # Company SLA breach monitor.
    - cron: "*/15 * * * *"
    # Billing recurring invoices — daily 03:00 UTC (was vercel.json "0 3 * * *")
    - cron: "0 3 * * *"
    # Telegram daily/weekly/monthly partner reports — target 9:00 PM IST =
    # 15:30 UTC. GitHub Actions `schedule` triggers are best-effort — run
    # history has shown delays past midnight IST into the next calendar day
    # (observed as late as 01:47 IST). A single scheduled entry, or even a
    # 75-90 min spread, isn't reliable enough. Fire every 15 min across
    # 15:00 UTC -> 00:45 UTC (20:30 IST -> 06:15 IST next day) instead —
    # this now matches isWithinReportWindow's full window in
    # src/lib/telegramReportData.ts, which also resolves a late-landing run
    # back to the correct business day (see reportDay() there) rather than
    # misjudging "today". alreadySentToday makes repeated triggers inside
    # the window a no-op once a cadence has sent. shouldSendReportToday()
    # decides whether today is a send day for each cadence: DAILY every
    # day, WEEKLY only Saturday, MONTHLY only the last calendar day of the
    # month.
    - cron: "0,15,30,45 15,16,17,18,19,20,21,22,23,0 * * *"
    # Trial-expiry Telegram warnings — daily 9:30 PM IST = 16:00 UTC
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  payment-delivery:
    if: github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Process durable payment delivery jobs
        run: |
          curl --max-time 120 -sf -X GET "${APP_URL}/api/cron/payment-delivery" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  field-force-offer-retry:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Retry expired Field Force provider offers
        run: |
          curl --max-time 120 -sf -X GET "${APP_URL}/api/cron/field-force-offer-retry" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  field-force-sla-monitor:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Monitor Field Force Company SLAs
        run: |
          curl --max-time 120 -sf -X GET "${APP_URL}/api/cron/field-force-sla-monitor" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  workflow-actions:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deliver queued workflow notifications
        run: |
          curl --max-time 120 -sf -X GET "${APP_URL}/api/cron/workflow-actions" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  billing-recurring-invoices:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing-recurring-invoices
        run: |
          curl -sf -X GET "${APP_URL}/api/cron/billing-recurring-invoices" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  telegram-reports:
    if: github.event.schedule == '0,15,30,45 15,16,17,18,19,20,21,22,23,0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger telegram-reports (daily/weekly/monthly partner digests)
        run: |
          curl -sf -X GET "${APP_URL}/api/cron/telegram-reports" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  subscription-expiry-check:
    if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger subscription-expiry-check (trial-expiry Telegram warnings)
        run: |
          curl -sf -X GET "${APP_URL}/api/cron/subscription-expiry-check" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
