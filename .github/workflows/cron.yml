name: Scheduled jobs

# GitHub Actions owns all scheduled execution. No Vercel Cron is configured.
on:
  schedule:
    - cron: "7,37 4-13 * * *"
    - cron: "0 3,7,11 * * *"
    - cron: "*/30 4-13 * * *"
    - cron: "0 5 * * *"
    - cron: "0,15 15 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        default: "all"
        type: choice
        options: [all, payment-delivery, field-force-offer-retry, field-force-sla-monitor, workflow-actions, event-starting-soon, legal-court-date-reminders, overdue-invoice-automations, low-stock-automations, billing-recurring-invoices, telegram-reports, subscription-expiry-check]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_BUSINESS_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_BUSINESS_PHONE_NUMBER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run due jobs directly (not through Vercel)
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ inputs.job }}
        run: |
          run() { npm run jobs:run -- "$1"; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$MANUAL_JOB" = "all" ]; then
              for job in payment-delivery field-force-offer-retry field-force-sla-monitor workflow-actions event-starting-soon legal-court-date-reminders overdue-invoice-automations low-stock-automations billing-recurring-invoices telegram-reports subscription-expiry-check; do run "$job"; done
            else
              run "$MANUAL_JOB"
            fi
          elif [ "$SCHEDULE" = "7,37 4-13 * * *" ]; then run payment-delivery
          elif [ "$SCHEDULE" = "0 3,7,11 * * *" ]; then run field-force-offer-retry; run field-force-sla-monitor
          elif [ "$SCHEDULE" = "*/30 4-13 * * *" ]; then run workflow-actions; run event-starting-soon
          elif [ "$SCHEDULE" = "0 5 * * *" ]; then run overdue-invoice-automations; run low-stock-automations; run billing-recurring-invoices
          elif [ "$SCHEDULE" = "0,15 15 * * *" ]; then run telegram-reports
          elif [ "$SCHEDULE" = "0 13 * * *" ]; then run legal-court-date-reminders; run subscription-expiry-check
          else echo "Unknown schedule: $SCHEDULE" >&2; exit 1
          fi
