name: Database backup

# Dumps the production Postgres DB (Neon) and the MongoDB cluster every 6
# hours and stores both as GitHub Release assets in this (private) repo,
# tagged backup-<UTC timestamp>. A cleanup job then deletes any backup-*
# release older than 7 days, so storage stays bounded. A final job posts a
# success/failure confirmation to a Telegram group.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL    - the DIRECT (unpooled) Postgres connection
#     string, i.e. the same value as DATABASE_URL_UNPOOLED in Vercel.
#     pg_dump needs a direct connection, not the pooled one the app uses.
#   BACKUP_MONGODB_URI     - the MongoDB connection string (mongodb+srv://...)
#   TELEGRAM_BOT_TOKEN     - the bot token from @BotFather
#   TELEGRAM_GROUP_CHAT_ID - the group chat id to post backup status to
#
# Uses the default GITHUB_TOKEN (via the `contents: write` permission below)
# to create/delete releases - no extra secret needed for that part.
#
# Restore:
#   Postgres: gunzip -c db-backup-<ts>.sql.gz | psql "$DATABASE_URL_UNPOOLED"
#   MongoDB:  mongorestore --uri="$MONGODB_URI" --archive=mongo-backup-<ts>.archive --gzip

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set timestamp
        run: echo "TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"

      - name: Install postgresql-client (v18, matching Neon's server version)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Dump Postgres database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "BACKUP_DATABASE_URL secret is not set - see comment at top of this workflow." >&2
            exit 1
          fi
          pg_dump "$DATABASE_URL" --format=plain --no-owner --no-privileges | gzip -9 > "db-backup-$TIMESTAMP.sql.gz"

      - name: Install MongoDB database tools
        run: |
          set -euo pipefail
          curl -sL -o mongo-tools.tgz https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar xf mongo-tools.tgz
          echo "$PWD/mongodb-database-tools-ubuntu2204-x86_64-100.9.4/bin" >> "$GITHUB_PATH"

      - name: Dump MongoDB database
        env:
          MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
        run: |
          set -euo pipefail
          if [ -z "${MONGODB_URI:-}" ]; then
            echo "BACKUP_MONGODB_URI secret is not set - skipping Mongo dump." >&2
            exit 0
          fi
          mongodump --uri="$MONGODB_URI" --archive="mongo-backup-$TIMESTAMP.archive" --gzip

      - name: Upload backups as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS="db-backup-$TIMESTAMP.sql.gz"
          if [ -f "mongo-backup-$TIMESTAMP.archive" ]; then
            ASSETS="$ASSETS mongo-backup-$TIMESTAMP.archive"
          fi
          gh release create "backup-$TIMESTAMP" \
            $ASSETS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Backup $TIMESTAMP" \
            --notes "Automated Postgres + MongoDB dump, retained 7 days." \
            --latest=false

  cleanup:
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - name: Delete backups older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            | awk -F'\t' '{print $3}' \
            | grep '^backup-' | while read -r tag; do
              created=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
              created_epoch=$(date -u -d "$created" +%s)
              if [ "$created_epoch" -lt "$cutoff" ]; then
                echo "Deleting old backup release: $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              fi
            done

  notify:
    needs: [backup, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_GROUP_CHAT_ID not set - skipping notification." >&2
            exit 0
          fi
          if [ "$BACKUP_RESULT" = "success" ] && [ "$CLEANUP_RESULT" = "success" ]; then
            STATUS="✅ DB backup succeeded (Postgres + MongoDB)"
          else
            STATUS="❌ DB backup FAILED (backup: $BACKUP_RESULT, cleanup: $CLEANUP_RESULT)"
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TEXT=$(printf '%s\nRepo: %s\nTime: %s\nRun: %s' "$STATUS" "$GITHUB_REPOSITORY" "$NOW" "$RUN_URL")
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_GROUP_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
