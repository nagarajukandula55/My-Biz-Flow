name: Database backup

# Dumps the production Postgres DB (Neon) and the MongoDB cluster every 3
# hours and stores both as GitHub Release assets in this (private) repo,
# tagged backup-<UTC timestamp>. A cleanup job then deletes any backup-*
# release older than 7 days, so storage stays bounded. A final job posts a
# success/failure confirmation to a Telegram group.
#
# Data-loss early warning (added 2026-09-25, after a same-day incident where
# `prisma migrate deploy` emptied several core tables — partners/
# partner_staff/business_records — between one backup and the next, only
# noticed when a partner reported it): right after each dump, this workflow
# compares that run's row-count manifest against the immediately PRECEDING
# backup's manifest. Any table whose count DECREASED sends an immediate,
# separate Telegram alert (not the routine success/failure summary at the
# end) naming the table and the before/after counts, so a drop like this is
# caught within one backup interval instead of only when someone notices the
# app is broken.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL    - the DIRECT (unpooled) Postgres connection
#     string, i.e. the same value as DATABASE_URL_UNPOOLED in Vercel.
#     pg_dump needs a direct connection, not the pooled one the app uses.
#   BACKUP_MONGODB_URI     - the MongoDB connection string (mongodb+srv://...)
#   TELEGRAM_BOT_TOKEN     - the bot token from @BotFather
#   TELEGRAM_GROUP_CHAT_ID - the group chat id to post backup status to
#
# Uses the default GITHUB_TOKEN (via the `contents: write` permission below)
# to create/delete releases - no extra secret needed for that part.
#
# Also uploads a manifest-<ts>.json asset (per-table row counts, captured
# at dump time) alongside the dump — read by the My-Biz-Flow-Admin app's
# /admin/backups page (src/lib/backups.ts there) to show a snapshot
# without downloading the full .sql.gz. That app needs its OWN read-only
# GitHub token (GITHUB_TOKEN + GITHUB_BACKUP_REPO in its own env, a
# fine-grained PAT scoped to Contents: Read-only on this repo) since it
# runs as a separate Vercel deployment with no access to this workflow's
# ephemeral github.token.
#
# Restore:
#   Postgres: gunzip -c db-backup-<ts>.sql.gz | psql "$DATABASE_URL_UNPOOLED"
#   MongoDB:  mongorestore --uri="$MONGODB_URI" --archive=mongo-backup-<ts>.archive --gzip
#   Or via the UI: My-Biz-Flow-Admin's /admin/backups page (data-only,
#   guarded restore — see src/lib/backups.ts there).

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set timestamp
        run: echo "TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"

      - name: Install postgresql-client (v18, matching Neon's server version)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Dump Postgres database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "BACKUP_DATABASE_URL secret is not set - see comment at top of this workflow." >&2
            exit 1
          fi
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=plain --no-owner --no-privileges | gzip -9 > "db-backup-$TIMESTAMP.sql.gz"

      - name: Generate row-count manifest
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Per-table row counts captured at dump time, so the Backups admin
          # page (My-Biz-Flow-Admin's /admin/backups) can show a snapshot
          # without downloading/parsing the full .sql.gz dump.
          /usr/lib/postgresql/18/bin/psql "$DATABASE_URL" -Atc "
            SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name
          " | while read -r t; do
            [ -z "$t" ] && continue
            c=$(/usr/lib/postgresql/18/bin/psql "$DATABASE_URL" -Atc "SELECT count(*) FROM \"$t\"")
            printf '%s\t%s\n' "$t" "$c"
          done | jq -Rn '
            [inputs | split("\t") | {(.[0]): (.[1] | tonumber)}] | add // {}
          ' > "manifest-$TIMESTAMP.json"

      - name: Alert immediately if any table's row count decreased vs the last backup
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          set -euo pipefail
          # Most recent existing backup-* release (this run's own release
          # doesn't exist yet — it's created in a later step) — the
          # comparison baseline.
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 \
            | awk -F'\t' '{print $3}' | grep '^backup-' | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous backup release found - nothing to compare against yet."
            exit 0
          fi
          PREV_MANIFEST_URL=$(gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name | startswith("manifest-")) | .name')
          if [ -z "$PREV_MANIFEST_URL" ]; then
            echo "Previous backup $PREV_TAG has no manifest asset (older backup) - skipping comparison."
            exit 0
          fi
          gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "manifest-*.json" -O "prev-manifest.json"

          DROPS=$(jq -n --slurpfile prev prev-manifest.json --slurpfile cur "manifest-$TIMESTAMP.json" '
            ($prev[0]) as $p | ($cur[0]) as $c |
            [ $p | keys[] as $t
              | select(($c[$t] // 0) < $p[$t])
              | { table: $t, before: $p[$t], after: ($c[$t] // 0) }
            ]
          ')
          echo "$DROPS" > drops.json
          DROP_COUNT=$(jq 'length' drops.json)
          echo "Tables with a decreased row count vs $PREV_TAG: $DROP_COUNT"

          if [ "$DROP_COUNT" -gt 0 ]; then
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN / TELEGRAM_GROUP_CHAT_ID not set - cannot send the data-loss alert!" >&2
              exit 1
            fi
            LINES=$(jq -r '.[] | "  \(.table): \(.before) -> \(.after) (-\(.before - .after))"' drops.json)
            TEXT=$(printf '🚨 DATA DECREASE DETECTED in backup %s (vs %s)\n%s\n\nThis usually means rows were deleted/overwritten between backups (e.g. a migration or manual DB change) — check immediately.\nRepo: %s\nRun: https://github.com/%s/actions/runs/%s' \
              "backup-$TIMESTAMP" "$PREV_TAG" "$LINES" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_GROUP_CHAT_ID}" \
              --data-urlencode "text=${TEXT}"
          fi

      - name: Install MongoDB database tools
        run: |
          set -euo pipefail
          curl -sL -o mongo-tools.tgz https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar xf mongo-tools.tgz
          echo "$PWD/mongodb-database-tools-ubuntu2204-x86_64-100.9.4/bin" >> "$GITHUB_PATH"

      - name: Dump MongoDB database
        env:
          MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
        run: |
          set -euo pipefail
          if [ -z "${MONGODB_URI:-}" ]; then
            echo "BACKUP_MONGODB_URI secret is not set - skipping Mongo dump." >&2
            exit 0
          fi
          mongodump --uri="$MONGODB_URI" --archive="mongo-backup-$TIMESTAMP.archive" --gzip

      - name: Upload backups as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS="db-backup-$TIMESTAMP.sql.gz manifest-$TIMESTAMP.json"
          if [ -f "mongo-backup-$TIMESTAMP.archive" ]; then
            ASSETS="$ASSETS mongo-backup-$TIMESTAMP.archive"
          fi
          gh release create "backup-$TIMESTAMP" \
            $ASSETS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Backup $TIMESTAMP" \
            --notes "Automated Postgres + MongoDB dump, retained 7 days." \
            --latest=false

  cleanup:
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - name: Delete backups older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            | awk -F'\t' '{print $3}' \
            | grep '^backup-' | while read -r tag; do
              created=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
              created_epoch=$(date -u -d "$created" +%s)
              if [ "$created_epoch" -lt "$cutoff" ]; then
                echo "Deleting old backup release: $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              fi
            done

  notify:
    needs: [backup, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_GROUP_CHAT_ID not set - skipping notification." >&2
            exit 0
          fi
          if [ "$BACKUP_RESULT" = "success" ] && [ "$CLEANUP_RESULT" = "success" ]; then
            STATUS="✅ DB backup succeeded (Postgres + MongoDB)"
          else
            STATUS="❌ DB backup FAILED (backup: $BACKUP_RESULT, cleanup: $CLEANUP_RESULT)"
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TEXT=$(printf '%s\nRepo: %s\nTime: %s\nRun: %s' "$STATUS" "$GITHUB_REPOSITORY" "$NOW" "$RUN_URL")
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_GROUP_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
